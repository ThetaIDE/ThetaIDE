# @package _global_
defaults:
  - /experiment/ncshare/cpu_smoke
  - _self_
experiment_id: cpu_study
tuning:
  component: optuna
  metric: eval/reward
  direction: maximize
  options:
    optuna:
      n_trials: 3
      n_jobs: 1
      sampler: random
      seed: 42
      study_name: ncshare_cpu_pilot
      study_mode: new
      pruner: none
methods:
  cpu:
    tune:
      agent.learning_rate: {type: log_float, low: 0.0001, high: 0.001}
