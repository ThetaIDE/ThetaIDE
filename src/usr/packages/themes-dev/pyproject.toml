[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themes-al"
version = "0.1.0"
readme = "README.md"
description = "Independent fixed-spacing TICC and hard EM-EDM reconstruction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "scikit-learn>=1.2", "torch>=2,<3", "pandas>=2,<3", "matplotlib>=3.7,<4"]

[project.scripts]
themes-al = "themes_al.cli:main"

[tool.setuptools.packages.find]
include = ["themes_al*"]

[tool.setuptools.data-files]
"share/themes-al" = ["PROVENANCE.json"]
