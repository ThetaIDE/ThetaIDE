# @package _global_
defaults:
  - override /env: gym_classic_control/cartpole
paradigm: online_rl
no_plot: true
seed: 42
total_timesteps: 16
eval_episodes: 1
trainer:
  accelerator: cpu
methods:
  ppo:
    agent:
      name: sb3-dev/ppo
      n_steps: 8
      batch_size: 4
      n_epochs: 1
    model:
      name: basics/dnn
      hidden_sizes: [16, 16]
