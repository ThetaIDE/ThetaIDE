[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-ide"
version = "0.1.0"
description = "General-purpose research IDE and modular experiment framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Process telemetry and worker resource management are also used headlessly.
    "psutil>=5.9",
    # Core ML
    "torch>=2.0,<3",
    "lightning>=2.0,<3",
    # Config & Sweeps
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    # Generic environment adapter used by the framework
    "gymnasium>=0.28",
    # Data & Visualization
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "tqdm>=4.60",
    "tabulate>=0.9",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Bounds a hung GUI test so CI fails in minutes rather than hours
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
]
# The desktop app. It composes configs in-process and runs training as a QProcess,
# so it installs into the same venv as the pipeline: pip install -e ".[gui]"
gui = [
    "PyQt6>=6.7,<7",
    "PyQt6-WebEngine>=6.7,<7",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "arxiv>=2.1",        # arXiv Papers panel
    "truststore>=0.9",   # HTTPS through the OS certificate store (networks that inspect TLS)
]
video = [
    "pygame",
    "vidmaker",
    "opencv-python",
]
tensorboard = [
    "tensorboard>=2.12",
]
all = [
    "theta-ide[dev,gui,video,tensorboard]",
]

# ── Package discovery ────────────────────────────────────────
[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src", "src.app", "src.app.*", "src.plugins", "src.plugins.components", "src.plugins.components.bundled", "src.plugins.components.bundled.*",
    "src.plugins.app", "src.plugins.app.bundled", "src.plugins.app.bundled.*",
    "src.usr", "src.usr.algorithms", "src.usr.models", "src.usr.models.sequential_spec",
    "frontend", "frontend.*", "plot", "plot.standard_figures", "hydra_plugins", "hydra_plugins.*",
]
exclude = ["*.installed", "*.installed.*", "*.node_modules", "*.node_modules.*"]

[tool.setuptools.package-data]
"src.plugins" = ["inventory.json"]
"src.app" = ["config_defaults/**/*.yaml"]
"src.plugins.components.bundled" = ["*/.theta_component.json", "**/*.json", "**/*.yaml"]
"src.plugins.app.bundled" = ["**/*.json", "**/*.svg", "**/*.html", "**/*.js", "**/*.css", "**/*.png", "**/*.md", "**/*.txt", "**/*.mjs"]
"frontend" = ["icons/*.svg", "icons/*.png", "*.qss", "themes/*.qss"]

# ── Ruff (linting + formatting) ─────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "src/plugins/components/installed",
    "src/plugins/app/installed",
    "src/usr",
    "in/envs",
    "venv",
]

[tool.ruff.lint]
# Start lenient — tighten incrementally
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E402",  # module level import not at top of file
    "E501",  # line too long (handled by formatter)
    "E701",  # multiple statements on one line
    "E702",  # multiple statements on one line (semicolon)
    "E741",  # ambiguous variable names (common in math-heavy RL code)
    "F401",  # unused imports (too noisy during initial adoption)
    "F811",  # redefinition of unused function
    "F841",  # unused local variables (too noisy during initial adoption)
    "W293",  # blank line contains whitespace
    "UP006", # non-standard generic types
    "UP035", # deprecated typing imports
]

[tool.ruff.lint.isort]
known-first-party = ["src", "plot"]

# ── Mypy (type checking) ────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "src/plugins/components/installed",
    "src/plugins/app/installed",
    "src/usr",
    "in/envs",
    "venv",
]

# ── Coverage ─────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "plot"]
omit = [
    "*/plugins/*/installed/*",
    "*/usr/*",
    "*/test_*",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]


# Web editor runtime bundles are shipped; npm dependency trees are build inputs.
[tool.setuptools.exclude-package-data]
"*" = ["**/node_modules/*", "**/node_modules/**/*"]
